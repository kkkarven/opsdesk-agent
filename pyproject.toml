[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdesk-agent"
version = "0.1.0"
description = "Traceable device-event data service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "numpy>=2,<3",
    "faiss-cpu==1.15.1",
]

[project.optional-dependencies]
demo = [
    "streamlit==1.67.0",
]
dev = [
    "pytest>=8,<10",
]
agent = [
    "langchain==1.4.9",
    "langchain-ollama==1.1.0",
]
workflow = [
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
]

[project.scripts]
opsdesk = "opsdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
