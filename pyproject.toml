[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdesk-agent"
version = "0.1.0"
description = "Device-event JSON validation, source preservation and SQLite ingestion; an early foundation for a future agent."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "kkkarven"}]
dependencies = ["pydantic>=2.10,<3"]

[project.urls]
Repository = "https://github.com/kkkarven/opsdesk-agent"

[project.scripts]
opsdesk = "opsdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
